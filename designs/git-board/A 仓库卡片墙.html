<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>A 仓库卡片墙</title>
<link rel="stylesheet" href="base.css"><link rel="stylesheet" href="home.css"><link rel="stylesheet" href="wx.css"><link rel="stylesheet" href="pager.css"><link rel="stylesheet" href="git.css">
<style>
  .title { flex-wrap: wrap; width: 900px; }
  .title .sub { flex-basis: 100%; margin: 14px 0 0 8px; }
  .trend { position: absolute; right: 112px; top: 96px; width: 700px; }
  .trend .chart { height: 130px; }
  .trend .cap { display: flex; justify-content: space-between; font-size: 24px; color: var(--t55); margin-bottom: 14px; }
  .trend .cap b { color: var(--t90); font-weight: 400; }
  .grid { position: absolute; left: 96px; right: 96px; top: 330px; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: 248px 248px; gap: 24px; }
  .card { padding: 24px 30px 22px; display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden; }
  .card .hd { display: flex; align-items: baseline; gap: 12px; white-space: nowrap; }
  .card .nm { font-family: var(--latin); font-size: 32px; font-weight: 500; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; }
  .card .n { margin-left: auto; font-family: var(--latin); font-size: 34px; font-weight: 300; color: var(--t90); }
  .card .n small { font-size: 20px; color: var(--t40); margin-left: 6px; font-family: var(--cjk); }
  .card .gp { font-family: var(--latin); font-size: 20px; color: var(--t40); margin-top: 2px; }
  .card .spark { margin: 16px 0 16px; height: 56px; }
  .card .ft { display: flex; align-items: center; gap: 14px; font-size: 23px; color: var(--t70); margin-top: auto; white-space: nowrap; }
  .card .ft .who { flex-shrink: 0; }
  .card .ft .msg { color: var(--t55); overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
  .card .ft .ci { font-family: var(--latin); font-size: 20px; letter-spacing: .06em; flex-shrink: 0; }
  .card.cold { opacity: .55; }
</style></head><body>
  <div class="title"><span class="big num" id="total"></span><span class="w">次提交 · 近 30 天</span><span class="sub"><b id="hot"></b> 个活跃仓库 · <b>23</b> 位贡献者 · 本周 <b>86</b> · 上周 <b>102</b></span></div>
  <div class="trend"><div class="cap"><span>每日提交 · 全部仓库</span><span>今天 <b class="num" id="today"></b></span></div><div class="chart" id="chart"></div><div class="axis"><span>9月24日</span><span>10月1日</span><span>10月8日</span><span>10月15日</span><span>今天</span></div></div>
  <div class="grid" id="grid"></div>
  <div class="bar panel">
    <div class="cell"><span class="icon">HDMI</span><span>插线即投屏</span></div>
    <div class="cell"><span class="dot" style="background:var(--ok)"></span><span>wevantage</span><span class="k">12 分钟前</span></div>
    <div class="cell"><span class="dot" style="background:var(--accent)"></span><span>api-gateway</span><span class="k">运行中</span></div>
    <div class="spacer"></div>
    <div class="dots"><i></i><i></i><i></i><i class="on"></i><span class="hint"><span class="num">‹ ›</span> 翻页</span></div>
  </div>
  <div class="note" style="bottom:160px">A · 仓库卡片墙（第 4 页）：左上总数 + 右上 30 天趋势，8 张仓库卡（30 天提交、迷你趋势、最近提交人与信息、CI）；冷仓库淡出</div>
<script src="data.js"></script><script>
  const tot = Array.from({length: DAYS}, (_, i) => total(i));
  document.getElementById("total").textContent = tot.reduce((a, b) => a + b, 0);
  document.getElementById("today").textContent = tot[DAYS - 1];
  document.getElementById("hot").textContent = REPOS.filter(r => r.tier === "hot").length;
  bars(document.getElementById("chart"), tot, 130);
  const CI = { ok: ["ci-ok", "CI ✓"], bad: ["ci-bad", "CI ✗"], run: ["ci-run", "CI …"] };
  const g = document.getElementById("grid");
  REPOS.slice().sort((a, b) => b.d.reduce((x, y) => x + y) - a.d.reduce((x, y) => x + y)).forEach(r => {
    const n = r.d.reduce((a, b) => a + b, 0);
    const el = document.createElement("div"); el.className = "card panel " + r.tier;
    el.innerHTML = `<div class="hd"><span class="tier ${r.tier}"></span><span class="nm">${r.name}</span><span class="n">${n}<small>提交</small></span></div><div class="gp">${r.group}</div>
      <div class="spark"></div>
      <div class="ft"><span class="who">${r.last}</span><span class="msg">${r.msg}</span><span class="ci ${CI[r.ci][0]}">${CI[r.ci][1]}</span></div>`;
    g.appendChild(el); bars(el.querySelector(".spark"), r.d, 56);
  });
</script></body></html>
