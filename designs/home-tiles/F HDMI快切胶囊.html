<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>F HDMI 快切胶囊</title>
<link rel="stylesheet" href="base.css"><link rel="stylesheet" href="home.css">
<style>
  /* C2 plus a second capsule that only exists while a device is plugged into an HDMI port:
     plug icon in a circle, the port's name, a green dot for "signal source connected". OK switches to it. */
  .topbtns .pill { opacity: .4; background: none; border-color: rgba(255,255,255,.35); transition: none; }
  .row { position: absolute; left: 112px; top: 640px; display: flex; gap: 36px; align-items: center; }
  .btn { display: inline-flex; align-items: center; gap: 26px; height: 120px; padding: 0 56px 0 28px; border-radius: 60px;
    background: none; border: 2px solid rgba(255,255,255,.35); font-size: 38px; font-weight: 500; opacity: .55; }
  .btn img { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; }
  .btn .ring { position: relative; width: 72px; height: 72px; border-radius: 50%; background: rgba(255,255,255,.14); display: flex; align-items: center; justify-content: center; }
  .btn .ring svg { width: 40px; height: 40px; fill: #fff; }
  .btn .dot { position: absolute; right: -2px; bottom: -2px; width: 22px; height: 22px; border-radius: 50%; background: #4CD964; border: 4px solid #0a0a0a; }
  .btn.lit { opacity: 1; background: linear-gradient(rgba(255,255,255,.26), rgba(255,255,255,.12)); border: 3px solid rgba(255,255,255,.9);
    box-shadow: 0 20px 50px rgba(0,0,0,.45); transform: scale(1.06); transform-origin: left center; }
</style></head><body>
  <div class="clockline"><span class="t">2:30</span><span class="ampm">上午</span><span class="sep"></span><span class="d">9月15日 星期二</span></div>
  <div class="topbtns"><span class="pill"><span class="ic"></span>输入源</span><span class="pill"><span class="ic"></span>有线网络</span><span class="pill"><span class="ic"></span>设置</span></div>
  <div class="row">
    <div class="btn"><img src="icon-smartshare.png">无线投屏</div>
    <div class="btn lit"><span class="ring"><svg viewBox="0 0 24 24"><path d="M7 2h10v4h2a1 1 0 0 1 1 1v6a4 4 0 0 1-4 4h-1v5h-6v-5H8a4 4 0 0 1-4-4V7a1 1 0 0 1 1-1h2V2zm2 2v2h6V4H9z"/></svg><span class="dot"></span></span>HDMI 2</div>
  </div>
  <div class="note">F · 插着线时主页多一个「HDMI 2」胶囊（绿点 = 已接设备），焦点移上去按 OK 即切源；拔线后胶囊消失</div>
</body></html>
